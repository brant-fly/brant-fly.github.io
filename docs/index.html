<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 日报｜AI MORNING SIGNAL</title>
  <meta name="description" content="由 AI HOT 公开 API 驱动的中文 AI 晨报仪表盘。">
  <style>
    :root{--ink:#1c1b19;--quiet:#6d6a63;--line:#d8d4ca;--paper:#fbfaf7;--mist:#efede7;--signal:#e6402d;--serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;--sans:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;--mono:"SFMono-Regular","Cascadia Mono","PingFang SC","Microsoft YaHei",monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;text-rendering:optimizeLegibility}main{max-width:1280px;margin:auto;padding:0 38px}.hero{padding:22px 0 42px;border-bottom:2px solid var(--ink)}.eyebrow{display:flex;justify-content:space-between;margin:0;padding-bottom:20px;border-bottom:1px solid var(--line);color:var(--quiet);font:700 10px var(--mono);letter-spacing:.08em}.hero-copy{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:40px;align-items:end;padding:52px 0 40px}.hero h1{margin:0;font:500 clamp(74px,12vw,154px)/.76 var(--serif);letter-spacing:-.08em}.date{margin:25px 0 0;color:var(--quiet);font:11px var(--mono);letter-spacing:.035em}.lede{margin:0 0 6px;font:21px/1.72 var(--serif);letter-spacing:.035em}.stats{display:grid;grid-template-columns:2fr repeat(5,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.stat{min-height:75px;padding:13px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}.stat:first-child{border-left:0}.stat.total{background:var(--ink);color:var(--paper)}.stat b{font:30px/.9 var(--serif)}.stat small{font:9px var(--mono);letter-spacing:.08em}nav{display:flex;align-items:center;gap:7px 18px;flex-wrap:wrap;padding:17px 0;border-bottom:1px solid var(--line)}nav span{margin-right:4px;color:var(--signal);font:10px var(--mono)}nav a{color:var(--ink);font:15px var(--serif);text-decoration:none}nav a:hover,.card a:hover,footer a:hover{color:var(--signal)}.status{display:flex;justify-content:space-between;gap:20px;padding:14px 0;color:var(--quiet);border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.025em}.status p{margin:0}.pulse{display:inline-block;width:6px;height:6px;margin:0 6px 1px 0;border-radius:50%;background:var(--signal)}.section{padding:62px 0;border-bottom:1px solid var(--ink);scroll-margin-top:8px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}.section-head p{margin:0 0 6px;color:var(--signal);font:10px var(--mono);letter-spacing:.13em}.section-head h2{margin:0;font:500 clamp(33px,4vw,48px)/1 var(--serif);letter-spacing:-.055em}.section-head>span{color:var(--quiet);font:15px var(--serif)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-right:0}.card{min-height:272px;padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:background .18s}.card:hover{background:var(--mist)}.top{display:flex;justify-content:space-between;gap:12px}.top b{color:var(--signal);font:11px var(--mono)}.chip{overflow:hidden;max-width:150px;color:var(--quiet);font:10px var(--mono);text-overflow:ellipsis;white-space:nowrap}.card h3{margin:25px 0 12px;font:500 24px/1.45 var(--serif);letter-spacing:.015em}.summary{margin:0;color:#5a5750;font:14px/1.78 var(--sans);letter-spacing:.012em}.card footer{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:20px;color:var(--quiet);font:10px var(--mono)}.card a,footer a{color:var(--ink);text-decoration:none}.card i{color:var(--signal);font-size:14px;font-style:normal}.empty{min-height:90px;padding:20px;border-right:1px solid var(--line);color:var(--quiet);font:13px/1.65 var(--sans)}body>main>footer{display:grid;grid-template-columns:1fr 2fr 1fr;gap:28px;padding:32px 0 46px;color:var(--quiet);font:10px/1.65 var(--mono)}body>main>footer p{margin:0}body>main>footer strong{color:var(--signal);font:500 27px var(--serif)}@media(max-width:780px){main{padding:0 20px}.hero-copy{grid-template-columns:1fr;gap:28px;padding:40px 0 32px}.lede{max-width:360px}.stats{grid-template-columns:repeat(3,1fr)}.status{display:block}.status p+p{margin-top:8px}.section{padding:43px 0}.section-head>span{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card:nth-child(3n){border-top:1px solid var(--line)}body>main>footer{grid-template-columns:1fr;gap:14px}}@media(max-width:500px){.hero h1{font-size:82px}.eyebrow{font-size:8px}nav{gap:9px 14px}nav span{width:100%}.grid{grid-template-columns:1fr}.card{min-height:215px}.card:not(:first-child){border-top:1px solid var(--line)}.card h3{margin-top:28px}}
  </style>
</head>
<body>
  <main>
    <header class="hero"><p class="eyebrow"><span>THE DAILY INTELLIGENCE</span><span id="year"></span></p><div class="hero-copy"><div><h1>AI 日报</h1><p class="date" id="date">正在获取 AI HOT 最新日报</p></div><p class="lede">用更少的噪音，看清今天真正值得跟进的 AI 信号。</p></div><div class="stats" id="stats"></div></header>
    <nav id="nav"><span>今日版块</span></nav>
    <div class="status"><p id="load"><span class="pulse"></span>正在读取 AI HOT 最新日报</p><p id="generated">AI HOT 会在未生成当日报时返回最近一期</p></div>
    <div id="feed"></div>
    <footer><p>本期共 <strong id="total">0</strong> 条</p><p>数据源：<a id="source" href="https://aihot.virxact.com" target="_blank" rel="noopener noreferrer">AI HOT</a>（仅使用其公开 API 最新日报数据）</p><p>AI MORNING SIGNAL · 北京时间呈现</p></footer>
  </main>
  <script>
    const API='https://aihot.virxact.com/api/v1/dailies/latest';
    const S=[['模型发布/更新','MODEL','能力、价格与可用性'],['产品发布/更新','PRODUCT','工具、功能与体验'],['行业动态','SIGNAL','公司、政策与市场'],['论文研究','PAPER','值得跟进的研究'],['技巧与观点','PRACTICE','方法、判断与工作流']];
    let report=null;
    const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const dateLabel=s=>{const d=s?new Date(s+'T12:00:00+08:00'):new Date();return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d)};
    const human=s=>{const d=new Date(s);return Number.isNaN(d)?'最新一期':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)};
    function render(){
      const listed=S.map(([name,tag,note])=>({name,tag,note,items:(report?.sections||[]).find(x=>x.label===name)?.items||[]}));
      let serial=0; document.querySelector('#stats').innerHTML='<div class="stat total"><b>'+listed.reduce((n,x)=>n+x.items.length,0)+'</b><small>条值得一看</small></div>'+listed.map(x=>'<div class="stat"><b>'+x.items.length+'</b><small>'+x.tag+'</small></div>').join('');
      document.querySelector('#nav').innerHTML='<span>今日版块</span>'+listed.map((x,i)=>'<a href="#section-'+(i+1)+'">'+String(i+1).padStart(2,'0')+' '+x.name+'</a>').join('');
      document.querySelector('#feed').innerHTML=listed.map((group,groupIndex)=>'<section class="section" id="section-'+(groupIndex+1)+'"><header class="section-head"><div><p>'+group.tag+' / '+String(groupIndex+1).padStart(2,'0')+'</p><h2>'+group.name+'</h2></div><span>'+group.note+'</span></header><div class="grid">'+(group.items.length?group.items.map(item=>{serial++;const url=item.links?.original||item.links?.aihot||report?.links?.aihot||'https://aihot.virxact.com';return '<article class="card"><div class="top"><b>'+String(serial).padStart(2,'0')+'</b><span class="chip">'+esc(item.source?.name||'AI HOT')+'</span></div><h3>'+esc(item.title)+'</h3><p class="summary">'+esc((item.summary||'打开原文了解完整背景与细节。').slice(0,60))+'</p><footer><time>'+human(report?.generatedAt)+'</time><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">原文 <i>↗</i></a></footer></article>'}).join(''):'<p class="empty">本期暂无此版块资讯。</p>')+'</div></section>').join('');
      document.querySelector('#total').textContent=serial;
    }
    async function load(){try{const response=await fetch(API);if(!response.ok)throw Error('request failed');const payload=await response.json();if(!payload.report?.sections)throw Error('report missing');report=payload.report;document.querySelector('#date').textContent=dateLabel(report.date)+' · AI HOT 最新日报';document.querySelector('#generated').textContent='日报生成于北京时间 '+human(report.generatedAt);document.querySelector('#source').href=report.links?.aihot||report.attribution?.url||'https://aihot.virxact.com';document.querySelector('#load').innerHTML='<span class="pulse"></span>AI HOT 数据读取已完成'}catch(e){document.querySelector('#load').innerHTML='<span class="pulse"></span>AI HOT 数据暂不可用，请稍后刷新'}render()}
    document.querySelector('#year').textContent='ISSUE / '+new Date().getFullYear();render();load();
  </script>
</body>
</html>
