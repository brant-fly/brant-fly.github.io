<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI 日报｜北京时间的 AI 晨报仪表盘"><title>AI 日报｜晨报仪表盘</title><style>
:root{--ink:#1c1b19;--quiet:#6d6a63;--line:#d8d4ca;--paper:#fbfaf7;--mist:#efede7;--signal:#e6402d;--serif:"Iowan Old Style","Baskerville","Songti SC","STSong",serif;--sans:"Aptos","PingFang SC","Microsoft YaHei",sans-serif;--mono:"Cascadia Mono","Noto Sans Mono CJK SC",monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}main{max-width:1280px;margin:auto;padding:0 38px}.hero{padding:22px 0 42px;border-bottom:2px solid var(--ink)}.eyebrow{display:flex;justify-content:space-between;margin:0;padding-bottom:20px;border-bottom:1px solid var(--line);color:var(--quiet);font:700 10px var(--mono);letter-spacing:.08em}.hero-copy{display:grid;grid-template-columns:1fr 290px;gap:40px;align-items:end;padding:52px 0 40px}h1{margin:0;font:500 clamp(74px,12vw,154px)/.76 var(--serif);letter-spacing:-.08em}.date{margin:25px 0 0;color:var(--quiet);font:11px var(--mono)}.lede{margin:0 0 6px;font:21px/1.55 var(--serif)}.stats{display:grid;grid-template-columns:2fr repeat(5,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.stat{min-height:75px;padding:13px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}.stat:first-child{border-left:0}.stat.total{background:var(--ink);color:var(--paper)}.stat b{font:30px/.9 var(--serif)}.stat small{font:9px var(--mono);letter-spacing:.08em}nav{display:flex;gap:7px 18px;flex-wrap:wrap;padding:17px 0;border-bottom:1px solid var(--line)}nav a{color:var(--ink);font:15px var(--serif);text-decoration:none}nav a:hover,a:hover{color:var(--signal)}nav span,.status{color:var(--signal);font:10px var(--mono)}.status{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);color:var(--quiet)}section{padding:62px 0;border-bottom:1px solid var(--ink);scroll-margin-top:8px}.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}.tag{margin:0 0 6px;color:var(--signal);font:10px var(--mono);letter-spacing:.13em}.head h2{margin:0;font:500 clamp(33px,4vw,48px)/1 var(--serif);letter-spacing:-.055em}.note{color:var(--quiet);font:15px var(--serif)}.grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-right:0}.card{min-height:258px;padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column}.card:hover{background:var(--mist)}.top,.foot{display:flex;justify-content:space-between;gap:12px}.top b{color:var(--signal);font:11px var(--mono)}.source,.foot{color:var(--quiet);font:10px var(--mono)}.card h3{margin:36px 0 11px;font:500 23px/1.24 var(--serif);letter-spacing:-.025em}.card p{margin:0;color:#5a5750;font:13px/1.65 var(--sans)}.foot{margin-top:auto;padding-top:20px}.foot a{color:var(--ink);text-decoration:none}.foot i{color:var(--signal);font-style:normal;font-size:14px}footer{display:grid;grid-template-columns:1fr 2fr 1fr;gap:28px;padding:32px 0 46px;color:var(--quiet);font:10px/1.65 var(--mono)}footer p{margin:0}footer strong{color:var(--signal);font:500 27px var(--serif)}@media(max-width:780px){main{padding:0 20px}.hero-copy{grid-template-columns:1fr;padding:40px 0 32px;gap:28px}.stats{grid-template-columns:repeat(3,1fr)}.status{display:block}.status p+p{margin-top:8px}.note{display:none}section{padding:43px 0}.grid{grid-template-columns:repeat(2,1fr)}footer{grid-template-columns:1fr;gap:14px}}@media(max-width:500px){h1{font-size:82px}.grid{grid-template-columns:1fr}.card:not(:first-child){border-top:1px solid var(--line)}nav span{width:100%}}
</style></head><body><main><header class="hero"><p class="eyebrow"><span>THE DAILY INTELLIGENCE</span><span id="year"></span></p><div class="hero-copy"><div><h1>AI 日报</h1><p class="date" id="date"></p></div><p class="lede">用更少的噪音，看清今天真正值得跟进的 AI 信号。</p></div><div class="stats" id="stats"></div></header><nav id="nav"><span>今日版块</span></nav><div class="status"><p id="load">● 正在读取公开数据源</p><p>北京时间 · 国际与中文公开数据源 · 无当日数据时保留最近一期</p></div><div id="feed"></div><footer><p>本期共 <strong id="total">0</strong> 条</p><p>数据源：Hacker News、OpenAlex、量子位 RSS、极客公园 RSS，以及官方与研究机构公开页面</p><p>AI MORNING SIGNAL · 北京时间呈现</p></footer></main><script>
const S=[['模型发布/更新','MODEL','能力、价格与可用性'],['产品发布/更新','PRODUCT','工具、功能与体验'],['行业动态','SIGNAL','公司、政策与市场'],['论文研究','PAPER','值得跟进的研究'],['技巧与观点','PRACTICE','方法、判断与工作流']];
let D=[['模型发布/更新','GPT-5.4 mini 在 ChatGPT 中上线','OpenAI','轻量推理模型向免费与 Go 用户逐步开放，并承担高峰期回退。','https://help.openai.com/en/articles/9624314-model-release-notes','8月4日 上午'],['模型发布/更新','MAI-Cyber-1-Flash 面向安全场景预览','Microsoft','面向代码漏洞发现的轻量模型进入公开预览，强调成本效率。','https://www.itpro.com/security/it-delivers-world-class-performance-at-50-percent-of-leading-models','8月3日 晚上'],['产品发布/更新','OpenAI 模型退役节奏更新','OpenAI','旧模型的 ChatGPT 退役计划持续推进，团队需检查依赖与预案。','https://help.openai.com/en/articles/9624314-model-release-notes','8月4日 上午'],['产品发布/更新','Windows AI Components 支持单独管理','Windows Central','Windows 更新让部分设备用户可独立管理本地 AI 组件。','https://www.windowscentral.com/','7月28日 下午'],['行业动态','欧盟 AI 透明度义务进入新阶段','European Commission','欧盟对与 AI 交互及 AI 合成内容的告知义务进入适用阶段。','https://digital-strategy.ec.europa.eu/','8月2日'],['行业动态','中文 AI 资讯已纳入每日采集','量子位 / 极客公园','中文科技媒体的公开 RSS 已纳入采集，按 AI 关键词与时间筛选。','https://www.qbitai.com/','持续更新'],['论文研究','AI 系统协助科学家撰写经验软件','Nature','研究展示 AI 在专家级经验软件任务上的潜力与评估路径。','https://www.nature.com/articles/s41586-026-10658-6','5月19日'],['论文研究','递归训练导致模型退化的防御方法','npj AI','研究聚焦递归训练下的模型坍塌风险，并提出防御思路。','https://www.nature.com/npjai/articles?year=2026','7月25日'],['技巧与观点','把“能用”改成可回滚的 AI 工作流','编辑部','先定义人工确认点、日志与失败回退，才适合接入关键流程。','https://www.nist.gov/itl/ai-risk-management-framework','今日 · 编辑观点'],['技巧与观点','评估 AI 工具：任务成功率优先于演示效果','编辑部','用真实任务、时间成本与人工复核比例衡量价值，而非单次输出。','https://www.nist.gov/itl/ai-risk-management-framework','今日 · 编辑观点']];
const cls=t=>/model|llm|gpt|claude|gemini|qwen|模型|大模型|推理/i.test(t)?S[0][0]:/launch|release|agent|app|product|发布|上线|产品|智能体|应用/i.test(t)?S[1][0]:/prompt|workflow|guide|提示词|工作流|方法|观点/i.test(t)?S[4][0]:S[2][0];const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function render(){document.querySelector('#year').textContent='ISSUE / '+new Date().getFullYear();document.querySelector('#date').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'full'}).format(new Date())+' · 最新可用一期';const stat=document.querySelector('#stats');stat.innerHTML='<div class="stat total"><b>'+D.length+'</b><small>条值得一看</small></div>'+S.map(x=>'<div class="stat"><b>'+D.filter(d=>d[0]===x[0]).length+'</b><small>'+x[1]+'</small></div>').join('');document.querySelector('#total').textContent=D.length;document.querySelector('#nav').innerHTML='<span>今日版块</span>'+S.map((x,i)=>'<a href="#s'+i+'">'+String(i+1).padStart(2,'0')+' '+x[0]+'</a>').join('');document.querySelector('#feed').innerHTML=S.map((x,i)=>{let ds=D.filter(d=>d[0]===x[0]);return '<section id="s'+i+'"><div class="head"><div><p class="tag">'+x[1]+' / '+String(i+1).padStart(2,'0')+'</p><h2>'+x[0]+'</h2></div><span class="note">'+x[2]+'</span></div><div class="grid">'+ds.map(d=>{let n=D.indexOf(d)+1;return '<article class="card"><div class="top"><b>'+String(n).padStart(2,'0')+'</b><span class="source">'+esc(d[2])+'</span></div><h3>'+esc(d[1])+'</h3><p>'+esc(d[3]).slice(0,60)+'</p><div class="foot"><time>'+esc(d[5])+'</time><a target="_blank" rel="noopener noreferrer" href="'+esc(d[4])+'">原文 <i>↗</i></a></div></article>'}).join('')+'</div></section>'}).join('')}
async function load(){try{let [hn,oa,qb,gp]=await Promise.all([fetch('https://hacker-news.firebaseio.com/v0/topstories.json'),fetch('https://api.openalex.org/works?search=artificial%20intelligence&sort=publication_date:desc&per-page=3'),fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.qbitai.com%2Ffeed'),fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.geekpark.net%2Frss')]);let ids=await hn.json(),items=await Promise.all(ids.slice(0,50).map(id=>fetch('https://hacker-news.firebaseio.com/v0/item/'+id+'.json').then(r=>r.json()))),fresh=items.filter(x=>x&&x.url&&/(ai|llm|model|gpt|claude|gemini|agent)/i.test(x.title||'')).slice(0,5).map(x=>[cls(x.title),x.title,'Hacker News','来自开发者社区的高热度讨论；请打开原文核对细节与上下文。',x.url,'近期更新']);let [papers,a,b]=await Promise.all([oa.json(),qb.json(),gp.json()]);fresh.push(...(papers.results||[]).map(x=>['论文研究',x.title,'OpenAlex','近期索引的 AI 论文；适合作为后续精读与检索入口。',x.doi?'https://doi.org/'+x.doi:x.id,'近期收录']),...[a,b].flatMap((x,i)=>(x.items||[]).filter(y=>/ai|人工智能|大模型|模型|智能体|生成式|算法|机器人/i.test(y.title||'')).slice(0,3).map(y=>[cls(y.title),y.title,i?'极客公园':'量子位','来自中文科技媒体的近期 AI 报道；打开原文获取完整背景与判断。',y.link,'近期发布'])));if(fresh.length>3)D=[...fresh,...D].slice(0,16)}catch(e){}document.querySelector('#load').textContent='● 数据读取已完成';render()}render();load();
</script><style>.card{min-height:340px}.thumb{width:100%;height:112px;margin-top:16px;object-fit:cover;filter:saturate(.7) contrast(.95);background:#efede7}.card h3{margin-top:15px}</style><script>
const thumbs={"模型发布/更新":['https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1535378917042-10a22c95931a?auto=format&fit=crop&w=900&q=80'],"产品发布/更新":['https://images.unsplash.com/photo-1551650975-87deedd944c3?auto=format&fit=crop&w=900&q=80'],"行业动态":['https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=900&q=80'],"论文研究":['https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=900&q=80'],"技巧与观点":['https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=900&q=80']};
async function translateTitle(node){let t=node.textContent.trim();if(!/[a-z]{3,}/i.test(t)||/[\u4e00-\u9fff]/.test(t)||node.dataset.done)return;node.dataset.done='1';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=en|zh-CN'),j=await r.json(),z=j.responseData&&j.responseData.translatedText;if(z&&!/MYMEMORY WARNING/i.test(z))node.textContent=z}catch(e){}}
function enrich(){document.querySelectorAll('.card').forEach((card,i)=>{let h=card.querySelector('h3');if(!h)return;let sec=card.closest('section').querySelector('h2').textContent.trim(),src=(thumbs[sec]||thumbs['行业动态'])[i%2];if(!card.querySelector('.thumb')){let img=document.createElement('img');img.className='thumb';img.loading='lazy';img.alt='';img.src=src;img.onerror=()=>{img.onerror=null;img.src='news-default.png'};card.querySelector('.top').after(img)}translateTitle(h)})}new MutationObserver(enrich).observe(document.querySelector('#feed'),{childList:true,subtree:true});enrich();
</script></body></html>
